[workspace]
members = [".", "slice_struct_macro"]

[package]
name = "slice_struct"
version = "0.4.0"
edition = "2024"
description = "A macro for structs with multiple inline, variable-length slices packed into a single heap allocation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ayushaanand/slice_struct_rs.git"
keywords = ["slice", "allocation", "macro", "dst", "memory"]
categories = ["memory-management", "rust-patterns"]

[dependencies]
slice_struct_macro = { version = "0.4.0", path = "slice_struct_macro" }
zerocopy = { version = "0.8.57", optional = true, features = ["derive"] }

[dev-dependencies]
cargo-rdme = "2.2.2"
criterion = "0.8.2"
rand = "0.10.2"

[[bench]]
name = "packet_bench"
harness = false

[[bench]]
name = "bench_drop"
harness = false

[[bench]]
name = "bench_random"
harness = false

[features]
zerocopy = ["dep:zerocopy"]
arena = ["slice_struct_macro/arena"]

